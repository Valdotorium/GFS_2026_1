<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendulum Canvas Simulation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Pendulum Canvas Simulation</h1>
    </header>
    <main>
        <canvas id="pendulumCanvas" width="800" height="600"></canvas>
        <div id="controls">
            <label for="length">Length:</label>
            <input type="number" id="length" value="140" min="50" max="400">
            <label for="mass">Mass:</label>
            <input type="number" id="mass" value="20" min="1" max="50">
            <label for="angle">Initial Angle (degrees):</label>
            <input type="number" id="angle" value="40" min="-90" max="90">
            <label for="timeStep" >Time Step:</label>
            <input type="number" id="timeStep" value="0.4"min="0.01" max="2">
            <button id="startButton">Start Simulation</button>

        </div>
        

        <script src="js/pendulum.js"></script>

    </main>
    <footer>
        <p>&copy; 2024 Pendulum Simulation</p>
    </footer>
</body>
</html>
